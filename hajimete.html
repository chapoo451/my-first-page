<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>はじめてのページ</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-color: navy;
      color: #fff;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
    }
    h1 {
      color: #fff;
      margin: 0 0 0.75rem;
    }
    .sub {
      font-size: 0.875rem;
      opacity: 0.9;
      margin-bottom: 1.5rem;
    }
    .reserve-btn {
      padding: 0.65rem 1.25rem;
      font-size: 1rem;
      cursor: pointer;
      border: 2px solid #fff;
      border-radius: 6px;
      background: transparent;
      color: #fff;
    }
    .reserve-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    .reserve-form {
      text-align: left;
      width: min(100%, 280px);
      margin-bottom: 1rem;
    }
    .reserve-form label {
      display: block;
      font-size: 0.875rem;
      margin-bottom: 0.35rem;
    }
    .reserve-form input {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 0.85rem;
      padding: 0.5rem 0.6rem;
      font-size: 1rem;
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    .reserve-form input::placeholder {
      color: rgba(255, 255, 255, 0.45);
    }
    .reserve-form input:focus {
      outline: none;
      border-color: #fff;
    }
    .reserve-form .reserve-btn {
      width: 100%;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>
  <h1>動いた！</h1>
  <p class="sub">2026年5月4日 開発スタート</p>
  <form class="reserve-form" id="reserveForm" action="#" method="post">
    <label for="customerName">お名前</label>
    <input type="text" id="customerName" name="customerName" autocomplete="name" placeholder="山田 太郎">
    <label for="customerTel">電話番号</label>
    <input type="tel" id="customerTel" name="customerTel" autocomplete="tel" placeholder="090-1234-5678">
    <button type="submit" class="reserve-btn">予約する</button>
  </form>
  <script>
    document.getElementById('reserveForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var name = document.getElementById('customerName').value.trim();
      if (!name) {
        alert('お名前を入力してください。');
        return;
      }
      alert(name + '様、予約を受け付けました！');
    });
  </script>
</body>
</html>
