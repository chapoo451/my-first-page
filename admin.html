<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予約管理</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: #fff;
      color: #333;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 2.5rem;
    }

    h1 {
      margin: 0 0 1.5rem;
      font-size: 1.375rem;
      font-weight: 600;
      text-align: center;
    }

    .field {
      margin-bottom: 1.125rem;
    }

    label {
      display: block;
      margin-bottom: 0.375rem;
      font-size: 0.9375rem;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 0.75rem 0.875rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      color: #333;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .login-box {
      max-width: 360px;
      margin: 0 auto;
    }

    .btn {
      padding: 0.75rem 1rem;
      font-size: 0.9375rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .btn-primary {
      width: 100%;
      color: #fff;
      background-color: #2563eb;
    }

    .btn-primary:hover {
      background-color: #1d4ed8;
    }

    .btn-danger {
      color: #dc2626;
      background-color: #fff;
      border: 1px solid #fca5a5;
    }

    .btn-danger:hover {
      background-color: #fef2f2;
    }

    .message {
      display: none;
      margin-top: 1rem;
      padding: 0.875rem 1rem;
      font-size: 0.9375rem;
      text-align: center;
      border-radius: 8px;
    }

    .message.is-visible {
      display: block;
    }

    .message.is-error {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    .admin-panel {
      display: none;
    }

    .admin-panel.is-visible {
      display: block;
    }

    .login-screen.is-hidden {
      display: none;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9375rem;
      background-color: #fff;
    }

    thead {
      background-color: #f8fafc;
    }

    th,
    td {
      padding: 0.75rem 0.875rem;
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
      white-space: nowrap;
    }

    th {
      font-weight: 600;
      color: #475569;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background-color: #fafafa;
    }

    .empty-cell {
      padding: 2rem 1rem;
      text-align: center;
      color: #64748b;
    }

    .count {
      margin-bottom: 1rem;
      font-size: 0.9375rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="login-screen" id="loginScreen">
      <div class="login-box">
        <h1>予約管理</h1>
        <form id="loginForm">
          <div class="field">
            <label for="password">パスワード</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary">ログイン</button>
        </form>
        <p class="message is-error" id="loginError"></p>
      </div>
    </section>

    <section class="admin-panel" id="adminPanel">
    <!-- 時間帯設定セクション -->
    <section style="margin-bottom:2rem;padding:1.5rem;border:1px solid #e2e8f0;border-radius:8px">
      <h2 style="margin-top:0;font-size:1.25rem">時間帯設定</h2>
      <div id="timeslot-list" style="margin-bottom:1rem">読み込み中...</div>
      <div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;padding-top:1rem;border-top:1px solid #eee">
        <span style="font-weight:bold">追加：</span>
        <input type="time" id="new-slot-time"
          style="padding:0.4rem;border:1px solid #ccc;border-radius:4px">
        <span>上限</span>
        <input type="number" id="new-slot-capacity" min="1" max="99" placeholder="件数"
          style="width:70px;padding:0.4rem;border:1px solid #ccc;border-radius:4px">
        <span>件</span>
        <button onclick="addTimeslot()"
          style="padding:0.4rem 1rem;background:#3182ce;color:white;border:none;border-radius:4px;cursor:pointer">
          追加
        </button>
      </div>
    </section>  
      <h1>予約管理</h1>
      <p class="count" id="reservationCount"></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>名前</th>
              <th>予約日</th>
              <th>時間</th>
              <th>人数</th>
              <th>連絡先</th>
              <th>受付日時</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="reservationTableBody"></tbody>
        </table>
      </div>
      <p class="message is-error" id="adminError"></p>
    </section>
  </div>

  <script>
    const ADMIN_PASSWORD = "admin1234";
    const API_URL = "/api/reservations";

    const loginScreen = document.getElementById("loginScreen");
    const loginForm = document.getElementById("loginForm");
    const loginError = document.getElementById("loginError");
    const adminPanel = document.getElementById("adminPanel");
    const adminError = document.getElementById("adminError");
    const reservationTableBody = document.getElementById("reservationTableBody");
    const reservationCount = document.getElementById("reservationCount");

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function formatReservationDate(dateValue) {
      const [year, month, day] = dateValue.split("-").map(Number);
      return `${year}年${month}月${day}日`;
    }

    function formatTime(timeValue) {
      const [hour, minute] = timeValue.split(":").map(Number);
      return `${hour}:${String(minute).padStart(2, "0")}`;
    }

    function formatCreatedAtJst(createdAt) {
      if (!createdAt) return "—";

      const jst = new Date(createdAt + 9 * 60 * 60 * 1000);
      const year = jst.getUTCFullYear();
      const month = jst.getUTCMonth() + 1;
      const day = jst.getUTCDate();
      const hour = jst.getUTCHours();
      const minute = String(jst.getUTCMinutes()).padStart(2, "0");

      return `${year}年${month}月${day}日 ${hour}:${minute}`;
    }

    function sortByDate(reservations) {
      return [...reservations].sort((a, b) => {
        if (a.date !== b.date) {
          return a.date.localeCompare(b.date);
        }
        return a.time.localeCompare(b.time);
      });
    }

    function showLoginError(message) {
      loginError.textContent = message;
      loginError.classList.add("is-visible");
    }

    function showAdminError(message) {
      adminError.textContent = message;
      adminError.classList.add("is-visible");
    }

    function hideAdminError() {
      adminError.textContent = "";
      adminError.classList.remove("is-visible");
    }

    function renderTable(reservations) {
      reservationCount.textContent = `全 ${reservations.length} 件`;

      if (reservations.length === 0) {
        reservationTableBody.innerHTML =
          '<tr><td class="empty-cell" colspan="7">予約はまだありません</td></tr>';
        return;
      }

      reservationTableBody.innerHTML = sortByDate(reservations).map((reservation) => `
        <tr>
          <td>${escapeHtml(reservation.name)}</td>
          <td>${escapeHtml(formatReservationDate(reservation.date))}</td>
          <td>${escapeHtml(formatTime(reservation.time))}</td>
          <td>${escapeHtml(String(reservation.guests))}名</td>
          <td>${escapeHtml(reservation.phone)}</td>
          <td>${escapeHtml(formatCreatedAtJst(reservation.createdAt))}</td>
          <td>
            <button type="button" class="btn btn-danger delete-btn" data-id="${escapeHtml(reservation.id)}">削除</button>
          </td>
        </tr>
      `).join("");
    }

// 時間帯管理
const TIMESLOT_URL = "/api/timeslots/all";

async function fetchTimeslots() {
  const res = await fetch(TIMESLOT_URL);
  if (!res.ok) throw new Error("時間帯の取得に失敗しました");
  return res.json();
}

async function loadTimeslots() {
  try {
    const slots = await fetchTimeslots();
    renderTimeslots(slots);
  } catch {
    document.getElementById("timeslot-list").innerHTML = "<p>読み込めませんでした</p>";
  }
}

function renderTimeslots(slots) {
  const list = document.getElementById("timeslot-list");
  if (slots.length === 0) {
    list.innerHTML = "<p>時間帯が登録されていません</p>";
    return;
  }
  list.innerHTML = slots.map(slot => `
    <div style="display:flex;align-items:center;gap:1rem;padding:0.5rem 0;border-bottom:1px solid #eee">
      <span style="min-width:60px">${slot.time}</span>
      <span>上限：</span>
      <input type="number" min="1" max="99" value="${slot.capacity}"
        style="width:60px;padding:0.25rem;border:1px solid #ccc;border-radius:4px"
        onchange="updateCapacity(${slot.id}, this.value)">
      <span>件</span>
      <button onclick="deleteTimeslot(${slot.id})"
        style="padding:0.25rem 0.75rem;background:#e53e3e;color:white;border:none;border-radius:4px;cursor:pointer">
        削除
      </button>
    </div>
  `).join("");
}

async function updateCapacity(id, capacity) {
  const res = await fetch(`/api/timeslots/${id}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ capacity: Number(capacity) })
  });
  if (!res.ok) alert("上限の変更に失敗しました");
}

async function deleteTimeslot(id) {
  if (!confirm("この時間帯を削除しますか？")) return;
  const res = await fetch(`/api/timeslots/${id}`, { method: "DELETE" });
  if (!res.ok) { alert("削除に失敗しました"); return; }
  await loadTimeslots();
}

async function addTimeslot() {
  const time = document.getElementById("new-slot-time").value;
  const capacity = document.getElementById("new-slot-capacity").value;
  if (!time || !capacity) { alert("時間と上限件数を入力してください"); return; }
  const res = await fetch("/api/timeslots", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ time, capacity: Number(capacity) })
  });
  if (!res.ok) { alert("追加に失敗しました"); return; }
  document.getElementById("new-slot-time").value = "";
  document.getElementById("new-slot-capacity").value = "";
  await loadTimeslots();
}

    async function fetchReservations() {
      const response = await fetch(API_URL);

      if (!response.ok) {
        throw new Error("一覧の取得に失敗しました");
      }

      return response.json();
    }

    async function loadReservations() {
      hideAdminError();

      try {
        const reservations = await fetchReservations();
        renderTable(reservations);
      } catch {
        reservationTableBody.innerHTML =
          '<tr><td class="empty-cell" colspan="7">予約一覧を読み込めませんでした</td></tr>';
        reservationCount.textContent = "";
        showAdminError("予約一覧の取得に失敗しました。");
      }
    }

    async function deleteReservation(id) {
      const response = await fetch(`${API_URL}/${id}`, { method: "DELETE" });

      if (!response.ok) {
        throw new Error("削除に失敗しました");
      }
    }

    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const password = loginForm.password.value;

      if (password !== ADMIN_PASSWORD) {
        showLoginError("パスワードが正しくありません");
        return;
      }

      loginError.classList.remove("is-visible");
      loginScreen.classList.add("is-hidden");
      adminPanel.classList.add("is-visible");
      loadReservations();
      loadTimeslots();
    });

    reservationTableBody.addEventListener("click", async (event) => {
      const deleteBtn = event.target.closest(".delete-btn");
      if (!deleteBtn) return;

      if (!confirm("この予約を削除しますか？")) return;

      try {
        await deleteReservation(deleteBtn.dataset.id);
        await loadReservations();
      } catch {
        showAdminError("予約の削除に失敗しました。");
      }
    });
  </script>
</body>
</html>
